services:

  file-backend:
    container_name: file-backend
    # 锁版本：集成测试要求环境可复现。这里取的是本机在跑的版本，
    # 直接钉 latest 会让某天镜像一变、测试就红，而代码一行没改。
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${FILE_SYSTEM_USER_NAME}
      MINIO_ROOT_PASSWORD: ${FILE_SYSTEM_PASSWORD}
    ports:
      - "9011:9011"
      - "9010:9010"
    volumes:
      - ./volumes/files:/data
    command: minio server /data --address :9010 --console-address ":9011"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9010/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  neo4j:
    container_name: neo4j
    # 锁版本。注意 Neo4j 已改用日历版本号（2025.x），不是 5.x 的延续 ——
    # 往回钉 5.26 是跨大版本降级，现有数据卷会直接起不来。
    image: neo4j:2025.08.0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASS}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
    volumes:
      - neo4j-data:/data
    healthcheck:
      # neo4j 镜像里**没有 curl**（有 wget 和 cypher-shell）。原先探的是
      # `curl -f http://localhost:7474`，于是这个容器永远 unhealthy —— 而 neo4j
      # 本身一直是好的，日志里明明写着 Started。一个恒为假的健康检查比没有更糟：
      # 它让人以为服务坏了，真坏的时候反而没人信。
      #
      # 用 cypher-shell 而不是探 HTTP 端口：它走的是 bolt，还要通过认证，
      # 与应用实际使用的路径一致。端口通了但密码不对，这条会红，而 HTTP 探测不会。
      #
      # 单个 $ ：由 compose 在解析时替换成实际值。写成 $$ 是把字面量传进容器，
      # 而容器里只有 NEO4J_AUTH，没有 NEO4J_USER / NEO4J_PASS 这两个变量。
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASS} 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
    
  postgres:
    container_name: postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
       - ./volumes/postgresql:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  redis:
    # M04 是里程碑预发布版，不该出现在任何人依赖的环境里。8.0 已 GA。
    image: redis:8.0-alpine
    volumes:
      - ./volumes/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 20s
      retries: 3
        
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=${ETCD_AUTO_COMPACTION_MODE}
      - ETCD_AUTO_COMPACTION_RETENTION=${ETCD_AUTO_COMPACTION_RETENTION}
      - ETCD_QUOTA_BACKEND_BYTES=${ETCD_QUOTA_BACKEND_BYTES}
      - ETCD_SNAPSHOT_COUNT=${ETCD_SNAPSHOT_COUNT}
    volumes:
      - etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_USER_NAME}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_PASSWORD}
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.6
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - standalone:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

# Observability backend: run SigNoz separately via its own docker-compose
# (see docs/observability.md). It exposes the OTLP collector on the same
# ports (4317/4318) so applications need no env changes.

volumes:
  standalone:
    driver: local
  etcd:
    driver: local
  minio:
    driver: local
  neo4j-data:
    driver: local

networks:
  default:
    name: revornix
