name: API Contract

# 前端的 web/src/generated 是 openapi-generator 的产物。在此之前，重新生成这一步
# 既没有脚本也没有任何东西会因为漏做而失败，于是它静静漂了两个月。这个 workflow
# 的唯一职责就是让「忘记同步」从无声漂移变成红灯。
on:
  push:
    branches: [master, develop]
  pull_request:

# 同一分支上新的推送取消旧的运行
concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: api 契约与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      # api 的依赖很重，这个 job 装一次就同时供契约校验和测试使用，
      # 不为跑测试再单开一个 job 重装一遍。
      - name: 安装 api 依赖
        working-directory: api
        run: pip install -r requirements.txt -r requirements-dev.txt

      # 抓「改了 router 但没导出 spec」
      - name: 校验 api/openapi.json
        working-directory: api
        run: python -m scripts.export_openapi --check

      # 测试不依赖真实配置：tests/conftest.py 会塞入确定性的假密钥。
      - name: 单元测试
        working-directory: api
        run: python -m pytest tests -q

  generated:
    name: 前端类型与 spec 一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # 生成器是 Java 写的
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      # 抓「spec 变了但没重新生成前端类型」。
      # 注意这里校验的是仓库里的 api/openapi.json —— spec 本身是否最新由上面那个
      # job 负责，两者合起来才覆盖完整链路。
      - name: 重新生成并比对
        working-directory: web
        run: |
          pnpm generate:api
          git diff --exit-code src/generated || {
            echo "::error::web/src/generated 与 api/openapi.json 不一致。请在 web/ 下运行 pnpm generate:api 并提交结果。"
            exit 1
          }

      # 顺带补上：这个仓库此前在 push/PR 上不跑任何检查
      - name: 类型检查
        working-directory: web
        run: pnpm exec tsc --noEmit -p tsconfig.json
