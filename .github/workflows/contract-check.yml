name: API Contract

# 前端的 web/src/generated 是 openapi-generator 的产物。在此之前，重新生成这一步
# 既没有脚本也没有任何东西会因为漏做而失败，于是它静静漂了两个月。这个 workflow
# 的唯一职责就是让「忘记同步」从无声漂移变成红灯。
on:
  push:
    branches: [master, develop]
  pull_request:

# 同一分支上新的推送取消旧的运行
concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: api 契约与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: uv.lock

      # api 的依赖很重，这个 job 装一次就同时供契约校验和测试使用，
      # 不为跑测试再单开一个 job 重装一遍。
      # 工作目录留在仓库根：uv workspace 的 .venv 和 uv.lock 都在这里。
      - name: 安装依赖
        run: uv sync --locked --all-packages

      # 抓「改了 router 但没导出 spec」。顺带是最便宜的整体冒烟：
      # 构建 spec 要 import 每一个 router，任何一处 import 坏掉都过不去。
      #
      # 这些密钥必须在**导入期**就有：app/encryption.py 在模块顶层校验它们，
      # 缺任何一个都会在 `from main import app` 那一行抛异常。本地是从
      # api/.env 读到的（那份文件不入库），所以这一步在开发机上一直是绿的，
      # 而 CI 里根本没有那份配置。值与 api/tests/conftest.py 里的假密钥一致：
      # AES-GCM 要 16/24/32 字节、按 base64 解，固定值让失败可复现。
      # 这 22 个变量必须在**导入期**就有 —— 不是运行时。app 里有一批模块在模块顶层
      # 就校验外部服务配置（encryption、redis、langfuse、milvus、neo4j、smtp、sms），
      # 缺任何一个都会在 `from main import app` 那一行抛异常，spec 根本构建不出来。
      # 全是假值：这一步不连任何外部服务，只是把 FastAPI 应用装配起来。
      #
      # 本地看不出问题，因为 api/.env 会被 load_dotenv 读到，而那份文件不入库。
      # 于是这个 job 从建立起就没有绿过一次。
      - name: 校验 api/openapi.json
        env: &import_time_env
          # AES-GCM 要 16/24/32 字节且按 base64 解，与 api/tests/conftest.py 同值
          APIKEY_ENCRYPT_KEY: &fake_key cmV2b3JuaXgtdGVzdC1rZXktMzItYnl0ZXMtbG9uZyE=
          ENGINE_CONFIG_ENCRYPT_KEY: *fake_key
          FILE_SYSTEM_CONFIG_ENCRYPT_KEY: *fake_key
          NOTIFICATION_SOURCE_CONFIG_ENCRYPT_KEY: *fake_key
          NOTIFICATION_TARGET_CONFIG_ENCRYPT_KEY: *fake_key
          OAUTH_SECRET_KEY: revornix-ci-oauth-secret
          REDIS_URL: localhost
          REDIS_PORT: "6379"
          LANGFUSE_PUBLIC_KEY: pk-ci
          LANGFUSE_SECRET_KEY: sk-ci
          MILVUS_CLUSTER_ENDPOINT: http://localhost:19530
          MILVUS_TOKEN: ci
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASS: ci-password
          SMTP_HOST: localhost
          SMTP_PORT: "25"
          SMTP_USERNAME: ci
          SMTP_PASSWORD: ci
          TENCENT_SECRET_ID: ci
          TENCENT_SECRET_KEY: ci
          TENCENT_SMS_APP_KEY: ci
          TENCENT_SMS_SDK_APP_ID: ci
          TENCENT_SMS_SIGN: ci
        run: uv run --directory api python -m scripts.export_openapi --check

      # 测试不依赖真实配置：tests/conftest.py 会塞入确定性的假密钥。
      - name: 单元测试
        env: *import_time_env
        run: uv run --directory api python -m pytest tests -q

  generated:
    name: 前端类型与 spec 一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package_json_file 不能省：这个 action 默认读**仓库根**的 package.json 找
      # packageManager 字段，而这个仓库根本没有根 package.json，于是报
      # "No pnpm version is specified" 而不是回退到某个默认版本。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # 生成器是 Java 写的
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      # 抓「spec 变了但没重新生成前端类型」。
      # 注意这里校验的是仓库里的 api/openapi.json —— spec 本身是否最新由上面那个
      # job 负责，两者合起来才覆盖完整链路。
      - name: 重新生成并比对
        working-directory: web
        run: |
          pnpm generate:api
          git diff --exit-code src/generated || {
            echo "::error::web/src/generated 与 api/openapi.json 不一致。请在 web/ 下运行 pnpm generate:api 并提交结果。"
            exit 1
          }

      # 顺带补上：这个仓库此前在 push/PR 上不跑任何检查
      - name: 类型检查
        working-directory: web
        run: pnpm exec tsc --noEmit -p tsconfig.json

      # 只跑纯逻辑的单测（lib/ 与 hooks/）；组件渲染测试是另一层投入。
      - name: 单元测试
        working-directory: web
        run: pnpm test
