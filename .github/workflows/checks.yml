name: Checks

# 在此之前，仓库在 push/PR 上不跑任何检查 —— 只有两个 tag 触发的发布流水线。
# 这里覆盖 contract-check.yml 没管的那几个服务，每个都用它自己已有的命令，
# 不为了 CI 另造一套。
on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirrored:
    name: app 包与导入检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 镜像检查只保证两侧**字节相同**，保证不了两侧**都能用** —— 一个文件在 api
      # 侧依赖的符号，worker 侧不一定有。这正是让 worker 起不来的那个缺陷的形态，
      # 而 compileall（只编译不导入）和单元测试（把相关模块顶成替身）都看不见。
      # 纯 AST 比对，0.7 秒，不需要装任何依赖。
      - name: 导入的名字是否真的存在
        run: python scripts/check_imports.py

      # app/ 已经不属于任何一个服务，得有人检查它的语法。
      # --no-project：uv run 在没有 .venv 时会**自动装齐整个 workspace**，
      # 而 compileall 只编译不导入，一个依赖都不需要。加了它是 0.1 秒，不加是几分钟。
      - name: app 语法检查
        run: uv run --no-project --python 3.11 python -m compileall -q app

  worker:
    name: worker 编译与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # worker 的依赖不轻（playwright、langgraph、各家 SDK），装齐一次代价太大。
      # compileall 不需要依赖，但能抓住语法错误和坏缩进 —— 这类问题此前要等任务
      # 真正跑起来才暴露。
      - name: 语法检查
        run: uv run --no-project --python 3.11 python -m compileall -q worker/workflow

      # 这批测试刻意只覆盖零依赖的纯逻辑（向量形状归一化、播客分级压缩、失败详情
      # 渲染）：conftest 把 crud / pymilvus / engine 那些顶成替身，所以只要 pytest
      # 就能跑，不必为了测试把整棵运行时依赖树拖进来。实测 400 个用例 1.5 秒。
      #
      # 这里必须写 --no-project：uv run 默认会先把 workspace 装齐（那正是上面两条
      # 注释想避免的事），--with pytest 则单独把 pytest 塞进这个临时环境。
      - name: 单元测试
        run: uv run --no-project --python 3.11 --with pytest --directory worker python -m pytest -q

  gateway:
    name: gateway 构建、vet 与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: 格式检查
        working-directory: gateway
        run: test -z "$(gofmt -l .)" || { echo "::error::以下文件未格式化，请运行 gofmt -w ."; gofmt -l .; exit 1; }
      - name: 构建
        working-directory: gateway
        run: go build ./...
      # vet 抓的是编译器不管但几乎必错的东西（Printf 格式串、结构体标签等）。
      # 本机 Go 是精简安装、没有 vet 工具，所以这一步只在 CI 上真正跑过。
      - name: vet
        working-directory: gateway
        run: go vet ./...
      - name: 单元测试
        working-directory: gateway
        run: go test ./...

  hot-news:
    name: hot-news lint、测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hot-news/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: hot-news
        run: pnpm install --frozen-lockfile
      - name: lint
        working-directory: hot-news
        run: pnpm lint
      - name: 单元测试
        working-directory: hot-news
        run: pnpm test
      - name: 构建
        working-directory: hot-news
        run: pnpm build

  desktop:
    name: desktop 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      # 只跑 node 原生 runner 的单测。test:e2e 要先打包 Electron 再拉 Playwright，
      # 代价和不稳定性都高得多，不适合挂在每个 PR 上。
      - name: 单元测试
        working-directory: desktop
        run: pnpm test

  docs:
    name: docs 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: docs
        run: pnpm install --frozen-lockfile
      # 文档站没有单独的类型检查脚本，build 本身就会跑类型检查并渲染全部页面。
      - name: 构建
        working-directory: docs
        run: pnpm build
