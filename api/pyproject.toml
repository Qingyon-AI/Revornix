[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revornix-api"
version = "0.1.0"
description = "FastAPI 入口：router / mcp_router"
requires-python = ">=3.11"
dependencies = [
    "revornix-app",
    "apscheduler==3.11.3",
    "fastapi[standard]==0.141.1",
    "google-auth==2.56.2",
    "markdown==3.10.3",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "webauthn==2.8.0",
]

[project.optional-dependencies]
# 本地 embedding 引擎。默认走云端（ALI_DASHSCOPE_EMBEDDING_ON），
# 装了才需要这一组 —— torch 的 wheel 是 527 MB。
local-embedding = ["torch==2.13.0", "sentence_transformers==5.6.1"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.setuptools]
packages = ["router", "mcp_router"]
py-modules = ["main"]

[tool.uv.sources]
revornix-app = { workspace = true }
