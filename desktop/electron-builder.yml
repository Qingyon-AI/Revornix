appId: com.revornix.desktop
productName: Revornix
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
afterPack: ./scripts/adhoc-sign.js
mac:
  category: public.app-category.productivity
  icon: assets/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # v1 ships UNSIGNED. `identity: null` forces ad-hoc signing so a stray
  # Developer ID cert in the build machine's keychain is NOT used — signing
  # with Developer ID but skipping notarization produces an app Gatekeeper
  # rejects ("Unnotarized Developer ID"), which is worse than ad-hoc.
  # To sign + notarize later: set identity to the cert name, hardenedRuntime
  # to true, and provide APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID.
  identity: null
  hardenedRuntime: false
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
# Auto-update publishing is reserved for a later iteration. v1 only produces
# installers; CI uploads them via a separate GitHub Release step. Adding a
# `publish:` block here would make electron-builder emit update-info metadata
# and fail local (untagged) builds.
